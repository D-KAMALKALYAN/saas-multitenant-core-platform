spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:

  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{tenantSlug}] [%X{correlationId}] [%X{requestId}] %logger{20} - %msg%n"

  level:
    com.saasplatform: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true


management:
  endpoint:
    health:
      show-details: always