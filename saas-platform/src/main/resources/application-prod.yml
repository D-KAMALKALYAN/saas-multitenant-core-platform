spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  flyway:
    enabled: true

logging:

  pattern:
    console: '{"time":"%d","level":"%level","tenant":"%X{tenantSlug}","req":"%X{requestId}","user":"%X{userId}","msg":"%msg"}%n'

  level:
    root: WARN
    com.saasplatform: INFO
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@platform.internal}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}


management:
  endpoint:
    health:
      show-details: never