server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: saas-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: SaasPlatformPool

      maximum-pool-size: 10
      minimum-idle: 5

      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    show-sql: true

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

        jdbc:
          batch_size: 20

        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      base-path: /actuator

      exposure:
        include:
          - health
          - info
          - metrics
          - flyway
          - prometheus

  endpoint:
    health:
      show-details: when-authorized

  info:
    app:
      name: SaaS Multi-Tenant Platform
      version: 1.0.0
      description: Production-grade multi-tenant SaaS infrastructure

app:
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:10}

  jwt:
    secret: ${JWT_SECRET}

    access-token-expiry: ${JWT_ACCESS_EXPIRY:3600000}
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:2592000000}

  rate-limit:
    plans:
      basic: ${RATE_LIMIT_BASIC:100}
      pro: ${RATE_LIMIT_PRO:500}
      enterprise: ${RATE_LIMIT_ENTERPRISE:2000}