server:
  port: 8080

spring:
  application:
    name: saas-platform
  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saas_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:kamal@PSQL1}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

app:
  security:
    bcrypt-strength: 10

  jwt:
    secret: ${JWT_SECRET:87be8d19b767e23b8bae50fe657b8cd240e7cb167caf36814d9f4c4d61693a63}
    access-token-expiry: 3600000
    refresh-token-expiry: 2592000000

  rate-limit:
      plans:
        basic: 100
        pro: 500
        enterprise: 2000