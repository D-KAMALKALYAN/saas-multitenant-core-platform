spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saas_platform_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  # Never provision a SUPER_ADMIN during tests.
  bootstrap:
    enabled: false

  # Test-only signing key. Overridden by JWT_SECRET in CI.
  jwt:
    secret: ${JWT_SECRET:test-secret-key-for-junit-testing-only-which-is-long-enough}
