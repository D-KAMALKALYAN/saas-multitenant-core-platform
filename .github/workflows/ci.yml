name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: saas_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        working-directory: ./saas-platform
        env:
          DB_URL: jdbc:postgresql://localhost:5432/saas_platform_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-not-for-production-use-1234
          SPRING_PROFILES_ACTIVE: test
          BOOTSTRAP_ENABLED: false
        run: mvn clean verify
